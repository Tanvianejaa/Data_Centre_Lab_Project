[project]
name = "datacenter-edge-project"
version = "0.1.0"
description = "Vision Duel — a human-vs-AI image recognition game over progressively de-corrupted images"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.143.1",
    "uvicorn>=0.54.0",
    "pydantic>=2.14.1",
    "pillow>=12.3.0",
    "numpy>=2.5.4",
    "torch>=2.14.1",
    "torchvision>=0.29.1",
    "open-clip-torch>=3.3.0",
]
